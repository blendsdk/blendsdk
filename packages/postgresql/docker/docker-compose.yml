services:
  postgres-test:
    image: postgres:15-alpine    
    environment:
      POSTGRES_DB: postgresql_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 5599:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresql_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s